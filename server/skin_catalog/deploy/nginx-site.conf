server {
    listen 443 ssl;
    server_name skins.example.org;

    ssl_certificate /etc/letsencrypt/live/skins.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skins.example.org/privkey.pem;
    client_max_body_size 32k;

    location / {
        limit_req zone=skin_catalog burst=40 nodelay;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
