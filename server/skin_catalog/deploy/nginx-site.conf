server {
    listen 443 ssl;
    server_name skins.example.org;

    ssl_certificate /etc/letsencrypt/live/skins.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skins.example.org/privkey.pem;
    client_max_body_size 32k;

    location = /v1/feedback {
        client_max_body_size 1m;
        access_log off;
        limit_req zone=feedback_inbox burst=5 nodelay;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /v1/copyright/complaints {
        client_max_body_size 1m;
        access_log off;
        limit_req zone=copyright_inbox burst=2 nodelay;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location = /v1/master-games/query {
        access_log off;
        limit_req zone=skin_catalog burst=10 nodelay;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        limit_req zone=skin_catalog burst=40 nodelay;
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
